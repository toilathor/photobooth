name: th_photobooth
description: "Lưu giữ mọi khoảnh khắc"
publish_to: "none"

version: 1.4.6+15
environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  material_ui: ^1.11.0
  camera: ^0.12.2
  provider: ^6.0.5
  get_it: ^9.3.0
  google_fonts: ^9.0.0
  gap: ^3.1.0

  googleapis: ^19.0.0
  google_sign_in: ^7.2.0
  web: ^1.1.2
  audioplayers: ^6.6.0
  animated_text_kit: ^4.3.0
  image: ^4.13.1
  flutter_staggered_grid_view: ^0.7.0
  flutter_lints: ^6.0.0
  video_player: ^2.11.1
  path_provider: ^2.1.5
  slang: any
  slang_flutter: any
  animated_toggle_switch: ^0.8.7
  lottie: ^3.8.2
  colorfilter_generator: ^0.0.8
  qr_flutter: ^4.1.0
  http: ^1.6.0
  screenshot: ^3.0.0
  responsive_framework: ^1.5.1
  gal: ^3.0.1
  ffmpeg_kit_flutter_new: ^4.6.8
  package_info_plus: ^10.1.0
  archive: ^4.7.1
  printing: ^5.14.3
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  build_runner: any
  slang_build_runner: any
  flutter_native_splash: ^2.4.7
  flutter_gen_runner: ^5.14.1

flutter:
  generate: true
  default-flavor: personal

  uses-material-design: true
  # Same script as the couple's names on the wedding invitation; bundled so
  # the header never waits on a font download at the venue.
  fonts:
    - family: PinyonScript
      fonts:
        - asset: assets/fonts/PinyonScript-Regular.ttf
  assets:
    - assets/animations/
    - assets/sounds/
    - assets/images/
    # frames:begin (generated by lib/helper/update_frames_data.dart)
    - assets/frames/commercial/
    - assets/frames/commercial/collected/amazing/
    - assets/frames/commercial/collected/basic/
    - assets/frames/commercial/collected/idol-hoat-hoa/
    - assets/frames/commercial/group/
    - assets/frames/commercial/standard/
    - assets/frames/commercial/thumbnails/collected/amazing/
    - assets/frames/commercial/thumbnails/collected/basic/
    - assets/frames/commercial/thumbnails/collected/idol-hoat-hoa/
    - assets/frames/commercial/thumbnails/group/
    - assets/frames/commercial/thumbnails/standard/
    - assets/frames/personal/
    - assets/frames/personal/group/
    - assets/frames/personal/standard/
    - assets/frames/personal/thumbnails/group/
    - assets/frames/personal/thumbnails/standard/
    # frames:end
